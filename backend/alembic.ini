[alembic]
# Migration scripts live in the backend's alembic directory.
script_location = %(here)s/alembic

# Add the backend directory to Python's import path.
prepend_sys_path = .

# Use the platform's path separator for migration locations and import paths.
path_separator = os

# env.py builds the database URL from the application's environment settings.
sqlalchemy.url =


# Logging settings used by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
